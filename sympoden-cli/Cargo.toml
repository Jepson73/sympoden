[package]
name = "sympoden-cli"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
rpassword = "7.5.4"
serde_json = "1.0.150"
sympoden-engine = { path = "../sympoden-engine" }
thiserror = "2.0.18"
