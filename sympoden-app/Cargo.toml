[package]
name = "sympoden-app"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sympoden-engine = { path = "../sympoden-engine" }
tauri = { version = "2.11.3", features = [] }
thiserror = "2.0.18"

[dev-dependencies]
base64 = "0.22.1"
static_assertions = "1.1.0"
tempfile = "3.27.0"
