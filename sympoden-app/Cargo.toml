[package]
name = "sympoden-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[build-dependencies]
tauri-build = "2"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sympoden-engine = { path = "../sympoden-engine" }
tauri = "2.11.3"
