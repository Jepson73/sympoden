name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    name: Build, test, lint, demo (engine + relay + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit toolchain-install step: ubuntu-latest ships rustup, and the
      # committed rust-toolchain.toml (channel 1.96.0, clippy+rustfmt) is picked up
      # automatically by the first cargo invocation below.

      - name: Build
        run: cargo build -p sympoden-engine -p sympoden-relay -p sympoden-cli

      - name: Test
        run: cargo test -p sympoden-engine -p sympoden-relay -p sympoden-cli

      - name: Clippy (-D warnings)
        run: cargo clippy -p sympoden-engine -p sympoden-relay -p sympoden-cli --all-targets -- -D warnings

      - name: Acceptance demo
        run: scripts/demo.sh

  tauri-app:
    # Separate job: sympoden-app (Tauri) needs system webview libraries
    # that a plain ubuntu-latest runner doesn't have, mirroring demo.sh's and the
    # workspace's own exclusion of this crate from the headless default path.
    name: Build sympoden-app (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev patchelf build-essential

      - name: Build sympoden-app
        run: cargo build -p sympoden-app

      - name: Test sympoden-app
        run: cargo test -p sympoden-app

      - name: Clippy sympoden-app (-D warnings)
        run: cargo clippy -p sympoden-app --all-targets -- -D warnings
